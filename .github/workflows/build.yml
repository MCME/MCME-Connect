name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Reject version ranges in pom.xml
        run: |
          if grep -nE '<version>\s*[\[(]' pom.xml; then
            echo "::error::pom.xml declares a version range; pin a concrete version"
            exit 1
          fi

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Read versions from the pom
        id: version
        run: |
          echo "version=$(mvn -q -ntp org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
          echo "minecraft=$(mvn -q -ntp org.apache.maven.plugins:maven-help-plugin:3.5.2:evaluate -Dexpression=minecraft.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: MCME-Connect-${{ steps.version.outputs.version }}
          path: target/MCME-Connect-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error

      - name: Check that the tag matches the pom version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pom version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '/^## \[/{p = ($2 == "[" ver "]")} p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="target/MCME-Connect-${{ steps.version.outputs.version }}.jar"
          sha256sum "$jar" > "$jar.sha256"
          gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha256" \
            --title "version ${GITHUB_REF_NAME#v} for mc ${{ steps.version.outputs.minecraft }}" \
            --notes-file release-notes.md
