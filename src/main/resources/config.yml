# proxy (Velocity) settings

# synchronization of gamemode between servers, defaults to false
syncGamemode:
  world: true
  moria: true
  plotworld: true
  freebuild: true
  themedbuilds: true
  newplayer: true
legacyRedirect:
    enabled: false
    from: newplayer
    to: build
disableMVTP:
- battle
serverWatchdog: true
connectDelay: 200
premiumVanish: true
# Base path for restorestats feature (leave empty to disable)
# restorestatsBasePath: /media/ssd1/bungee-mcme/

# for synchronization of first joined date create in plugin data folder a 
# symlink to playerdata folder of first join server.
